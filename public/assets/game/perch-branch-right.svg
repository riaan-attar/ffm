<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <defs>
    <linearGradient id="woodGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#5C3A21"/>
      <stop offset="100%" stop-color="#3D2314"/>
    </linearGradient>
    <linearGradient id="leafGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <!-- Main branch extending from right -->
  <path d="M 160 18 Q 120 22, 70 24 Q 30 25, 5 30 Q 20 38, 70 34 Q 120 32, 160 35 Z" fill="url(#woodGradR)" stroke="#3D2314" stroke-width="1.5"/>
  <!-- Branch knots & grain -->
  <path d="M 130 24 Q 100 27, 75 28" stroke="#A07248" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 65 29 Q 40 30, 25 32" stroke="#A07248" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Leaves -->
  <path d="M 95 30 Q 85 42, 75 36 Q 82 30, 95 30 Z" fill="url(#leafGradR)" stroke="#15803D" stroke-width="1"/>
  <path d="M 35 31 Q 22 40, 18 33 Q 26 28, 35 31 Z" fill="url(#leafGradR)" stroke="#15803D" stroke-width="1"/>
  <path d="M 125 22 Q 118 10, 108 14 Q 114 22, 125 22 Z" fill="url(#leafGradR)" stroke="#15803D" stroke-width="1"/>
</svg>
