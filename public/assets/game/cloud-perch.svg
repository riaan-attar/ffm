<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 60" width="140" height="60">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#E2EEF9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#BAD6F0" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Cloud Puff Base -->
  <path d="M 25 45 C 10 45, 0 35, 8 22 C 12 10, 30 8, 42 16 C 52 4, 80 4, 90 15 C 104 8, 126 14, 130 28 C 138 38, 130 45, 115 45 Z" fill="url(#cloudGrad)" filter="url(#cloudGlow)"/>
  <!-- Highlight Shading -->
  <ellipse cx="65" cy="20" rx="22" ry="12" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="100" cy="26" rx="16" ry="8" fill="#FFFFFF" opacity="0.4"/>
</svg>
