<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="browserBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#244A68"/>
      <stop offset="100%" stop-color="#14314A"/>
    </linearGradient>
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6CA68"/>
      <stop offset="100%" stop-color="#DDA02E"/>
    </linearGradient>
    <linearGradient id="navyCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193B57"/>
      <stop offset="100%" stop-color="#0E2436"/>
    </linearGradient>
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071724" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071724" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="110" fill="#F2BD58" opacity="0.12" filter="blur(24px)"/>

  <!-- Main 2.5D Browser Window -->
  <g transform="matrix(0.96 0 -0.06 0.96 25 15)" filter="url(#shadowLg)">
    <!-- Base Canvas -->
    <rect x="70" y="45" width="220" height="155" rx="16" fill="url(#browserBase)" stroke="#FFF" stroke-width="2"/>
    
    <!-- Browser Header Bar -->
    <rect x="70" y="45" width="220" height="30" rx="16" fill="url(#headerGrad)"/>
    <!-- Overlap mask fix for square bottom corners on header -->
    <rect x="70" y="60" width="220" height="15" fill="url(#headerGrad)"/>
    
    <!-- Window Control Dots -->
    <circle cx="88" cy="58" r="4.5" fill="#EF4444"/>
    <circle cx="102" cy="58" r="4.5" fill="#F59E0B"/>
    <circle cx="116" cy="58" r="4.5" fill="#10B981"/>

    <!-- URL Pill -->
    <rect x="135" y="52" width="130" height="12" rx="6" fill="#102D46" opacity="0.4"/>

    <!-- Wireframe Layout Inside Browser -->
    <!-- Sidebar -->
    <rect x="85" y="85" width="40" height="100" rx="6" fill="#D5C5A1" opacity="0.4"/>
    <rect x="92" y="94" width="26" height="6" rx="3" fill="#BCA67C"/>
    <rect x="92" y="106" width="20" height="4" rx="2" fill="#BCA67C" opacity="0.7"/>
    <rect x="92" y="115" width="24" height="4" rx="2" fill="#BCA67C" opacity="0.7"/>
    
    <!-- Main Content Grid Rows -->
    <rect x="135" y="85" width="140" height="42" rx="8" fill="#FFFFFF" opacity="0.7"/>
    <rect x="145" y="96" width="60" height="7" rx="3.5" fill="#102D46" opacity="0.8"/>
    <rect x="145" y="108" width="100" height="5" rx="2.5" fill="#6D8290" opacity="0.5"/>
    
    <rect x="135" y="135" width="65" height="50" rx="8" fill="#FFFFFF" opacity="0.6"/>
    <rect x="210" y="135" width="65" height="50" rx="8" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Floating 2.5D Gold Code Badge (< / >) -->
  <g transform="translate(185, 120)" filter="url(#shadowSm)">
    <rect x="0" y="0" width="125" height="76" rx="14" fill="url(#goldCardGrad)" stroke="#FFE89E" stroke-width="2"/>
    <!-- Code Syntax Text -->
    <text x="62" y="46" font-family="'Plus Jakarta Sans', monospace" font-size="28" font-weight="900" fill="#0B2338" text-anchor="middle" letter-spacing="-1">&lt;/&gt;</text>
    <rect x="20" y="56" width="35" height="4" rx="2" fill="#0B2338" opacity="0.4"/>
    <rect x="65" y="56" width="40" height="4" rx="2" fill="#0B2338" opacity="0.4"/>
  </g>

  <!-- Secondary Floating Navy Tag -->
  <g transform="translate(85, 160)" filter="url(#shadowSm)">
    <rect x="0" y="0" width="75" height="45" rx="10" fill="url(#navyCardGrad)" stroke="#396184" stroke-width="1.5"/>
    <text x="37" y="28" font-family="'Plus Jakarta Sans', monospace" font-size="16" font-weight="800" fill="#F8F1DF" text-anchor="middle">&lt;dev&gt;</text>
  </g>

  <!-- Decorative Sparkles -->
  <g fill="#F2BD58">
    <path d="M 65 95 L 68 83 L 71 95 L 83 98 L 71 101 L 68 113 L 65 101 L 53 98 Z"/>
    <path d="M 325 180 L 327 172 L 329 180 L 337 182 L 329 184 L 327 192 L 325 184 L 317 182 Z" transform="scale(0.8) translate(80, 20)"/>
  </g>
</svg>
