<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="gearGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#F2BD58"/>
      <stop offset="100%" stop-color="#C6891E"/>
    </linearGradient>
    <linearGradient id="gearCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193D5C"/>
      <stop offset="100%" stop-color="#0B2338"/>
    </linearGradient>
    <linearGradient id="creamNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </linearGradient>
    <filter id="shadowAutoLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071724" flood-opacity="0.35"/>
    </filter>
    <filter id="shadowAutoSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071724" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="200" cy="150" r="110" fill="#F2BD58" opacity="0.15" filter="blur(26px)"/>

  <!-- Orbital Automation Flow Curves -->
  <path d="M 120 150 C 120 90, 280 80, 280 150 C 280 220, 120 210, 120 150" stroke="#F2BD58" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.5"/>
  <path d="M 270 120 L 285 150 L 255 155" fill="none" stroke="#F2BD58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M 130 180 L 115 150 L 145 145" fill="none" stroke="#F2BD58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Main 2.5D Golden Central Gear -->
  <g transform="translate(200, 150)" filter="url(#shadowAutoLg)">
    <!-- Gear Extrusion 3D layer -->
    <circle cx="0" cy="8" r="48" fill="#9E680E"/>
    
    <!-- Outer Gear Body -->
    <circle cx="0" cy="0" r="48" fill="url(#gearGoldGrad)" stroke="#FFF2C6" stroke-width="2"/>
    
    <!-- 8 Gear Teeth with 3D Depth -->
    <!-- Top & Bottom -->
    <rect x="-10" y="-58" width="20" height="15" rx="3" fill="url(#gearGoldGrad)"/>
    <rect x="-10" y="43" width="20" height="15" rx="3" fill="url(#gearGoldGrad)"/>
    <!-- Left & Right -->
    <rect x="-58" y="-10" width="15" height="20" rx="3" fill="url(#gearGoldGrad)"/>
    <rect x="43" y="-10" width="15" height="20" rx="3" fill="url(#gearGoldGrad)"/>
    <!-- Diagonals -->
    <g transform="rotate(45)">
      <rect x="-10" y="-58" width="20" height="15" rx="3" fill="url(#gearGoldGrad)"/>
      <rect x="-10" y="43" width="20" height="15" rx="3" fill="url(#gearGoldGrad)"/>
      <rect x="-58" y="-10" width="15" height="20" rx="3" fill="url(#gearGoldGrad)"/>
      <rect x="43" y="-10" width="15" height="20" rx="3" fill="url(#gearGoldGrad)"/>
    </g>

    <!-- Gear Inner Core Cavity -->
    <circle cx="0" cy="0" r="22" fill="url(#gearCoreGrad)" stroke="#9E680E" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#F2BD58"/>
  </g>

  <!-- Connected Workflow Node 1: Zap / Trigger Card (Top Right) -->
  <g transform="translate(260, 60)" filter="url(#shadowAutoSm)">
    <rect x="0" y="0" width="65" height="52" rx="12" fill="url(#creamNodeGrad)" stroke="#FFF" stroke-width="1.5"/>
    <!-- Lightning Icon -->
    <path d="M 32 12 L 23 27 L 30 27 L 27 40 L 40 24 L 32 24 Z" fill="#F2BD58" stroke="#DDA02E" stroke-width="1"/>
  </g>

  <!-- Connected Workflow Node 2: Database / Pipeline Box (Bottom Left) -->
  <g transform="translate(65, 160)" filter="url(#shadowAutoSm)">
    <rect x="0" y="0" width="70" height="58" rx="12" fill="url(#creamNodeGrad)" stroke="#FFF" stroke-width="1.5"/>
    <rect x="12" y="14" width="46" height="6" rx="3" fill="#102D46"/>
    <rect x="12" y="26" width="34" height="6" rx="3" fill="#102D46" opacity="0.7"/>
    <rect x="12" y="38" width="40" height="6" rx="3" fill="#F2BD58"/>
  </g>

  <!-- Connected Node 3: Sync Success Check Badge (Top Left) -->
  <g transform="translate(100, 75)" filter="url(#shadowAutoSm)">
    <circle cx="18" cy="18" r="18" fill="url(#gearGoldGrad)" stroke="#FFE89E" stroke-width="1.5"/>
    <path d="M 12 18 L 16 22 L 24 13" fill="none" stroke="#0B2338" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Little Sync Droplets & Glow Spores -->
  <circle cx="310" cy="190" r="5" fill="#F2BD58" opacity="0.8"/>
  <circle cx="170" cy="70" r="3.5" fill="#FFF"/>
  <circle cx="230" cy="240" r="4" fill="#FFF" opacity="0.7"/>
</svg>
