<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="barNavy1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E4466"/>
      <stop offset="100%" stop-color="#102D46"/>
    </linearGradient>
    <linearGradient id="barNavy2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B5D88"/>
      <stop offset="100%" stop-color="#1A4061"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCE195"/>
      <stop offset="40%" stop-color="#F2BD58"/>
      <stop offset="100%" stop-color="#D69723"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2BD58"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3EAD7"/>
    </linearGradient>
    <filter id="shadowMktLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071724" flood-opacity="0.28"/>
    </filter>
    <filter id="shadowMktSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071724" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="210" cy="140" r="110" fill="#E5AE45" opacity="0.14" filter="blur(26px)"/>

  <!-- Background Grid Lines -->
  <g opacity="0.3" stroke="#9EAFBD" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="90" y1="80" x2="310" y2="80"/>
    <line x1="90" y1="130" x2="310" y2="130"/>
    <line x1="90" y1="180" x2="310" y2="180"/>
  </g>

  <!-- 2.5D Growth Bar Chart Columns -->
  <g filter="url(#shadowMktLg)">
    <!-- Bar 1 (Short - Navy) -->
    <g transform="translate(100, 155)">
      <!-- Top Cap -->
      <path d="M 0 6 L 14 0 L 38 0 L 24 6 Z" fill="#3B678F"/>
      <!-- Front -->
      <rect x="0" y="6" width="24" height="60" rx="4" fill="url(#barNavy1)"/>
      <!-- Right Side -->
      <path d="M 24 6 L 38 0 L 38 60 L 24 66 Z" fill="#0B2338"/>
    </g>

    <!-- Bar 2 (Medium - Slate Navy) -->
    <g transform="translate(145, 125)">
      <!-- Top Cap -->
      <path d="M 0 6 L 14 0 L 38 0 L 24 6 Z" fill="#4B81B0"/>
      <!-- Front -->
      <rect x="0" y="6" width="24" height="90" rx="4" fill="url(#barNavy2)"/>
      <!-- Right Side -->
      <path d="M 24 6 L 38 0 L 38 90 L 24 96 Z" fill="#102D46"/>
    </g>

    <!-- Bar 3 (Tall - Gold) -->
    <g transform="translate(190, 85)">
      <!-- Top Cap -->
      <path d="M 0 6 L 14 0 L 38 0 L 24 6 Z" fill="#FFF2C6"/>
      <!-- Front -->
      <rect x="0" y="6" width="24" height="130" rx="4" fill="url(#barGold)"/>
      <!-- Right Side -->
      <path d="M 24 6 L 38 0 L 38 130 L 24 136 Z" fill="#B77C15"/>
    </g>

    <!-- Bar 4 (Peak - Super Gold) -->
    <g transform="translate(235, 55)">
      <!-- Top Cap -->
      <path d="M 0 6 L 14 0 L 38 0 L 24 6 Z" fill="#FFFFFF"/>
      <!-- Front -->
      <rect x="0" y="6" width="24" height="160" rx="4" fill="url(#barGold)"/>
      <!-- Right Side -->
      <path d="M 24 6 L 38 0 L 38 160 L 24 166 Z" fill="#B77C15"/>
    </g>
  </g>

  <!-- Dynamic Upward Trending Golden Arrow Line -->
  <g filter="url(#shadowMktSm)">
    <!-- Smooth Spline -->
    <path d="M 80 185 Q 140 165, 180 110 T 285 45" fill="none" stroke="#F2BD58" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <polygon points="295,35 288,52 280,42 268,48 276,33" fill="url(#arrowGrad)" stroke="#B77C15" stroke-width="1.5"/>
    <!-- Data Points along curve -->
    <circle cx="112" cy="172" r="5" fill="#FFFFFF" stroke="#F2BD58" stroke-width="2.5"/>
    <circle cx="157" cy="142" r="5" fill="#FFFFFF" stroke="#F2BD58" stroke-width="2.5"/>
    <circle cx="202" cy="102" r="6" fill="#FFFFFF" stroke="#F2BD58" stroke-width="3"/>
    <circle cx="247" cy="68" r="6" fill="#FFFFFF" stroke="#F2BD58" stroke-width="3"/>
  </g>

  <!-- Floating Target / Conversion User Badge -->
  <g transform="translate(270, 140)" filter="url(#shadowMktSm)">
    <circle cx="28" cy="28" r="26" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- User Silhouette -->
    <circle cx="28" cy="20" r="7.5" fill="#102D46"/>
    <path d="M 16 39 C 16 32, 21 30, 28 30 C 35 30, 40 32, 40 39 Z" fill="#102D46"/>
    <!-- Green/Gold Check dot -->
    <circle cx="44" cy="14" r="7" fill="#F2BD58" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M 41 14 L 43 16 L 47 12" fill="none" stroke="#0B2338" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle & Accent Dots -->
  <circle cx="95" cy="80" r="4" fill="#F2BD58"/>
  <circle cx="315" cy="95" r="3" fill="#102D46" opacity="0.5"/>
</svg>
