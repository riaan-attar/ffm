<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="artboardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EADBBE"/>
    </linearGradient>
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F2BD58"/>
      <stop offset="100%" stop-color="#C6891E"/>
    </linearGradient>
    <linearGradient id="imgCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2BD58"/>
      <stop offset="100%" stop-color="#E5AE45"/>
    </linearGradient>
    <linearGradient id="darkUIGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193B57"/>
      <stop offset="100%" stop-color="#0E2436"/>
    </linearGradient>
    <filter id="shadowUxLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071724" flood-opacity="0.32"/>
    </filter>
    <filter id="shadowUxSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071724" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="190" cy="150" r="110" fill="#F2BD58" opacity="0.14" filter="blur(26px)"/>

  <!-- Base 2.5D Artboard / Canvas -->
  <g transform="matrix(0.96 0.05 -0.05 0.96 25 15)" filter="url(#shadowUxLg)">
    <!-- Canvas Window -->
    <rect x="75" y="45" width="200" height="155" rx="16" fill="url(#artboardGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Artboard Header UI -->
    <circle cx="92" cy="62" r="4.5" fill="#102D46" opacity="0.4"/>
    <circle cx="106" cy="62" r="4.5" fill="#102D46" opacity="0.4"/>
    <circle cx="120" cy="62" r="4.5" fill="#102D46" opacity="0.4"/>
    <rect x="150" y="58" width="60" height="8" rx="4" fill="#102D46" opacity="0.25"/>

    <!-- UI Wireframe Grid on Canvas -->
    <!-- Card 1 -->
    <rect x="90" y="80" width="78" height="48" rx="8" fill="#D5C5A1" opacity="0.45"/>
    <rect x="98" y="88" width="30" height="6" rx="3" fill="#102D46" opacity="0.6"/>
    <rect x="98" y="98" width="55" height="4" rx="2" fill="#102D46" opacity="0.35"/>
    <rect x="98" y="106" width="45" height="4" rx="2" fill="#102D46" opacity="0.35"/>

    <!-- Card 2 -->
    <rect x="180" y="80" width="78" height="48" rx="8" fill="#D5C5A1" opacity="0.45"/>
    <rect x="188" y="88" width="40" height="6" rx="3" fill="#102D46" opacity="0.6"/>
    <rect x="188" y="98" width="55" height="4" rx="2" fill="#102D46" opacity="0.35"/>
    <rect x="188" y="106" width="35" height="4" rx="2" fill="#102D46" opacity="0.35"/>

    <!-- Bottom Wide Panel -->
    <rect x="90" y="138" width="168" height="45" rx="8" fill="#D5C5A1" opacity="0.35"/>
    <circle cx="112" cy="160" r="12" fill="#BCA67C" opacity="0.6"/>
    <rect x="135" y="152" width="70" height="6" rx="3" fill="#102D46" opacity="0.5"/>
    <rect x="135" y="162" width="105" height="4" rx="2" fill="#102D46" opacity="0.3"/>
  </g>

  <!-- Floating Golden Image / Media Component (Top Left) -->
  <g transform="translate(60, 95)" filter="url(#shadowUxSm)">
    <rect x="0" y="0" width="70" height="60" rx="12" fill="url(#imgCardGrad)" stroke="#FFE89E" stroke-width="2"/>
    <!-- Image Icon Mountain & Sun -->
    <circle cx="48" cy="20" r="5" fill="#FFFFFF"/>
    <polygon points="12,48 28,26 42,42 50,34 60,48" fill="#0B2338" opacity="0.35"/>
    <polygon points="12,48 26,30 38,44 46,36 58,48" fill="#FFFFFF"/>
  </g>

  <!-- Floating 2.5D Digital Pen / Stylus Tool -->
  <g transform="translate(260, 100) rotate(35)" filter="url(#shadowUxSm)">
    <!-- Pen Barrel -->
    <rect x="0" y="0" width="22" height="90" rx="6" fill="url(#penBodyGrad)" stroke="#FFF2C6" stroke-width="1.5"/>
    <!-- Pen Grip Lines -->
    <rect x="0" y="25" width="22" height="3" fill="#B77C15"/>
    <rect x="0" y="32" width="22" height="3" fill="#B77C15"/>
    <!-- Nib Tip -->
    <polygon points="0,90 22,90 11,112" fill="#102D46"/>
    <circle cx="11" cy="110" r="2.5" fill="#F2BD58"/>
    <!-- Top Eraser Cap -->
    <rect x="3" y="-8" width="16" height="8" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Design Pointer Cursor -->
  <g transform="translate(195, 175)" filter="url(#shadowUxSm)">
    <path d="M 0 0 L 18 18 L 10 19 L 14 28 L 9 30 L 5 21 L 0 26 Z" fill="#102D46" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Color Palette Swatch Dots -->
  <g transform="translate(85, 195)">
    <circle cx="0" cy="0" r="7" fill="#102D46" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="18" cy="0" r="7" fill="#F2BD58" stroke="#FFF" stroke-width="1.5"/>
    <circle cx="36" cy="0" r="7" fill="#F8F1DF" stroke="#FFF" stroke-width="1.5"/>
  </g>
</svg>
