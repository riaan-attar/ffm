<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4466"/>
      <stop offset="50%" stop-color="#102D46"/>
      <stop offset="100%" stop-color="#091A29"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143653"/>
      <stop offset="100%" stop-color="#0C2133"/>
    </linearGradient>
    <linearGradient id="goldAppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D378"/>
      <stop offset="100%" stop-color="#E2A633"/>
    </linearGradient>
    <linearGradient id="creamWidgetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1E8D5"/>
    </linearGradient>
    <filter id="shadowAppLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071724" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowAppSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#071724" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="150" r="105" fill="#E5AE45" opacity="0.12" filter="blur(24px)"/>

  <!-- Main 2.5D Mobile / Web App Device -->
  <g transform="matrix(0.95 -0.12 0.08 0.95 30 35)" filter="url(#shadowAppLg)">
    <!-- Device Body -->
    <rect x="110" y="30" width="130" height="205" rx="24" fill="url(#phoneBody)" stroke="#4A759C" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="118" y="42" width="114" height="180" rx="16" fill="url(#screenGrad)"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="155" y="48" width="40" height="6" rx="3" fill="#071724"/>

    <!-- UI App Content -->
    <!-- Metric Header -->
    <rect x="128" y="66" width="94" height="42" rx="10" fill="#1C476E" opacity="0.6"/>
    <rect x="136" y="75" width="40" height="5" rx="2.5" fill="#F2BD58"/>
    <rect x="136" y="85" width="60" height="8" rx="4" fill="#FFFFFF"/>

    <!-- Content Tiles -->
    <rect x="128" y="116" width="43" height="45" rx="8" fill="#1C476E" opacity="0.4"/>
    <rect x="179" y="116" width="43" height="45" rx="8" fill="#1C476E" opacity="0.4"/>
    <rect x="128" y="168" width="94" height="36" rx="8" fill="#1C476E" opacity="0.4"/>
  </g>

  <!-- Floating 2.5D Gold Action Widget -->
  <g transform="translate(180, 115)" filter="url(#shadowAppSm)">
    <rect x="0" y="0" width="135" height="55" rx="12" fill="url(#goldAppGrad)" stroke="#FFF2C6" stroke-width="2"/>
    <!-- Toggle Switch / Slider -->
    <rect x="16" y="18" width="42" height="18" rx="9" fill="#0B2338" opacity="0.3"/>
    <circle cx="47" cy="27" r="7" fill="#FFFFFF"/>
    <!-- Stat Lines -->
    <rect x="70" y="18" width="48" height="7" rx="3.5" fill="#0B2338"/>
    <rect x="70" y="30" width="34" height="5" rx="2.5" fill="#0B2338" opacity="0.6"/>
  </g>

  <!-- Floating Cream Dashboard Tile -->
  <g transform="translate(70, 135)" filter="url(#shadowAppSm)">
    <rect x="0" y="0" width="70" height="65" rx="12" fill="url(#creamWidgetGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="25" cy="24" r="10" fill="#102D46"/>
    <path d="M 22 24 L 28 24 M 25 21 L 25 27" stroke="#F2BD58" stroke-width="2" stroke-linecap="round"/>
    <rect x="14" y="42" width="42" height="5" rx="2.5" fill="#102D46" opacity="0.7"/>
    <rect x="14" y="50" width="28" height="4" rx="2" fill="#6D8290" opacity="0.6"/>
  </g>

  <!-- Floating Golden Settings Cog / Badge -->
  <g transform="translate(270, 180)" filter="url(#shadowAppSm)">
    <circle cx="20" cy="20" r="18" fill="url(#goldAppGrad)" stroke="#FFF2C6" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="7" fill="#0B2338"/>
    <!-- Teeth -->
    <rect x="17" y="0" width="6" height="5" rx="1" fill="url(#goldAppGrad)"/>
    <rect x="17" y="35" width="6" height="5" rx="1" fill="url(#goldAppGrad)"/>
    <rect x="0" y="17" width="5" height="6" rx="1" fill="url(#goldAppGrad)"/>
    <rect x="35" y="17" width="5" height="6" rx="1" fill="url(#goldAppGrad)"/>
  </g>
</svg>
